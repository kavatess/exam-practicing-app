<div class="adm-subject-mgmt">
  <aside class="adm-subject-panel">
    <div class="adm-panel-header">
      <h3>Subjects</h3>
      <button mat-raised-button color="primary" (click)="openNewSubjectDialog()">
        + New Subject
      </button>
    </div>

    <div class="adm-subject-list" *ngIf="subjects$ | async as subjects; else loadingSubjects">
      <div class="adm-empty-state" *ngIf="subjects.length === 0">No subjects yet.</div>

      <button
        type="button"
        class="adm-subject-row"
        *ngFor="let subject of subjects"
        [class.adm-subject-row--active]="(selectedSubjectId$ | async) === subject.id"
        (click)="selectSubject(subject)"
      >
        <span class="adm-subject-row-name">{{ subject.name }}</span>
        <mat-icon class="adm-subject-row-chevron">chevron_right</mat-icon>
      </button>
    </div>

    <ng-template #loadingSubjects>
      <div class="adm-loading">
        <mat-spinner diameter="32"></mat-spinner>
      </div>
    </ng-template>
  </aside>

  <section class="adm-course-panel">
    <ng-container *ngIf="selectedSubject$ | async as subject; else noSubjectSelected">
      <div class="adm-panel-header">
        <h3>{{ subject.name }}</h3>
        <button mat-raised-button color="primary" (click)="openNewCourseDialog(idOf(subject.id))">
          + New Course
        </button>
      </div>

      <div *ngIf="loading$ | async" class="adm-loading">
        <mat-spinner diameter="32"></mat-spinner>
      </div>

      <table mat-table [dataSource]="(courses$ | async) || []" class="adm-course-table" *ngIf="!(loading$ | async)">
        <ng-container matColumnDef="code">
          <th mat-header-cell *matHeaderCellDef>Code</th>
          <td mat-cell *matCellDef="let course">{{ course.code }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let course">{{ course.name }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let course">{{ truncate(course.description) }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let course">
            <button mat-button (click)="openEditCourseDialog(idOf(subject.id), course)">Edit</button>
            <button mat-button color="warn" (click)="deleteCourse(course)">Delete</button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="courseColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: courseColumns"></tr>
      </table>
    </ng-container>

    <ng-template #noSubjectSelected>
      <div class="adm-placeholder">Select a subject to view its courses</div>
    </ng-template>
  </section>
</div>
