<div class="sm-page">
  <header class="sm-page-head">
    <p class="sm-breadcrumb">Admin / Subject Management</p>
    <h1 class="sm-page-title">Subject Management</h1>
  </header>

  <div class="sm-panels">
    <adm-subject-list
      class="sm-panel-list"
      [subjects]="subjects"
      [selectedId]="selectedSubjectId"
      (select)="selectSubject($event)"
      (create)="openSubjectModal(null)"
      (edit)="openSubjectModal($event)"
    ></adm-subject-list>

    @if (selectedSubject; as subject) {
      <adm-subject-detail
        class="sm-panel-detail"
        [subject]="subject"
        (editSubject)="openSubjectModal(subject)"
        (createUnit)="openUnitModal(null)"
        (editUnit)="openUnitModal($event)"
        (removeUnit)="removeUnit($event)"
        (removeSubUnit)="removeSubUnit($event.unit, $event.subUnitId)"
      ></adm-subject-detail>
    }
  </div>
</div>

@if (overlay === 'subject') {
  <adm-subject-modal
    [subject]="editingSubject"
    (dismiss)="closeOverlay()"
    (save)="saveSubject($event)"
  ></adm-subject-modal>
}

@if (overlay === 'unit' && selectedSubject) {
  <adm-unit-modal
    [unit]="editingUnit"
    [defaultOrder]="selectedSubject!.units.length + 1"
    (dismiss)="closeOverlay()"
    (save)="saveUnit($event)"
  ></adm-unit-modal>
}
