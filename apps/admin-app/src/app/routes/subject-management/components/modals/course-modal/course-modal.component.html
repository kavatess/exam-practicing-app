<adm-modal-shell
  [eyebrow]="eyebrow"
  [title]="title"
  [width]="760"
  confirmLabel="Save course"
  (dismiss)="dismiss.emit()"
  (confirm)="save.emit(draft)"
>
  <div class="sm-form">
    <div class="sm-grid sm-grid-name">
      <label class="sm-field">
        <span class="sm-field-label">Name</span>
        <input class="sm-field-control" type="text" placeholder="Course name" [(ngModel)]="draft.name" />
      </label>
      <label class="sm-field">
        <span class="sm-field-label">Code</span>
        <input
          class="sm-field-control sm-field-control--mono"
          type="text"
          placeholder="THPTQG-2025-MATH"
          [(ngModel)]="draft.code"
        />
      </label>
    </div>

    <div class="sm-grid sm-grid-meta">
      <label class="sm-field">
        <span class="sm-field-label">Year</span>
        <input class="sm-field-control" type="number" min="2000" [(ngModel)]="draft.year" />
      </label>
      <label class="sm-field">
        <span class="sm-field-label">Type</span>
        <select class="sm-field-control" [(ngModel)]="draft.courseType">
          @for (type of courseTypes; track type) {
            <option [ngValue]="type">{{ type }}</option>
          }
        </select>
      </label>
    </div>

    <label class="sm-field">
      <span class="sm-field-label">Description</span>
      <textarea
        class="sm-field-control"
        rows="2"
        placeholder="What this exam covers and who it is for…"
        [(ngModel)]="draft.description"
      ></textarea>
    </label>

    <div class="sm-field">
      <div class="sm-scope-head">
        <span class="sm-field-label">Unit scope</span>
        <span class="sm-field-hint">Pick which units of {{ subjectName }} this course draws from</span>
      </div>
      <adm-unit-transfer
        [units]="units"
        [selectedIds]="draft.unitIds"
        (selectedIdsChange)="onScopeChange($event)"
      ></adm-unit-transfer>
    </div>
  </div>
</adm-modal-shell>
