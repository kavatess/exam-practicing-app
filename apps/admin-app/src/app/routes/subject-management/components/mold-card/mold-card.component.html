<div class="sm-mold" [class.expanded]="expanded">
  <div class="sm-mold-head">
    <button
      type="button"
      class="sm-mold-main"
      [attr.aria-expanded]="expanded"
      (click)="toggleExpand.emit()"
    >
      <svg
        class="sm-chevron"
        [class.open]="expanded"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
      >
        <path d="M9 6l6 6-6 6"></path>
      </svg>

      <span class="sm-mold-text">
        <span class="sm-mold-title-row">
          <span class="sm-mold-name">{{ mold.name }}</span>
          <span class="sm-pill" [class.kind-test]="isTest" [class.kind-practice]="!isTest">{{ kindLabel }}</span>
        </span>
        <span class="sm-stats">
          <span class="sm-stat">
            <span class="sm-stat-key">Duration</span>
            <span class="sm-stat-val">{{ durationLabel }}</span>
          </span>
          <span class="sm-stat">
            <span class="sm-stat-key">Questions</span>
            <span class="sm-stat-val">{{ mold.numOfQuestions }}</span>
          </span>
          <span class="sm-stat">
            <span class="sm-stat-key">Passing</span>
            <span class="sm-stat-val">{{ passingLabel }}</span>
          </span>
          <span class="sm-stat">
            <span class="sm-stat-key">Pages</span>
            <span class="sm-stat-val">{{ mold.pages.length }}</span>
          </span>
        </span>
      </span>

      <span class="sm-status" [class.active]="isActive">{{ mold.status }}</span>
    </button>

    <button type="button" class="sm-action" title="Edit mold" (click)="edit.emit()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20h4L19 9l-4-4L4 16v4ZM14 6l4 4"></path>
      </svg>
    </button>
    <button type="button" class="sm-action danger" title="Delete mold" (click)="remove.emit()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"></path>
      </svg>
    </button>
  </div>

  @if (expanded) {
    <div class="sm-structure">
      <div class="sm-structure-head">
        <span class="sm-eyebrow">Structure · {{ structureMeta }}</span>
        <span class="sm-hint">Drag a page by its handle to reorder</span>
      </div>

      <div class="sm-pages">
        @for (page of mold.pages; track page.id; let i = $index) {
          <adm-mold-page
            [page]="page"
            [units]="units"
            [index]="i"
            [moldQuestionCount]="mold.numOfQuestions"
            (addBlock)="addBlock.emit(page.id)"
            (removeBlock)="removeBlock.emit({ pageId: page.id, blockId: $event })"
            (patchBlock)="onPatchBlock(page.id, $event)"
          ></adm-mold-page>
        }

        <button type="button" class="sm-add-page" (click)="addPage.emit()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
          Add page
        </button>
      </div>

      <div class="sm-structure-foot">
        <span>{{ balance }}</span>
        <span class="sm-planned">{{ plannedQuestions }} of {{ mold.numOfQuestions }} planned</span>
      </div>
    </div>
  }
</div>
