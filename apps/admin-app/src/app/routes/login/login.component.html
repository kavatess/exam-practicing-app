<div class="adm-login-wrapper">
  <!-- Left Column: Branding/Visual -->
  <div class="adm-login-left d-none d-lg-flex flex-column justify-content-between p-5">
    <div class="adm-logo">
      <!-- Placeholder for Logo -->
    </div>
    <div class="text-center text-white">
      <h1 class="display-4 fw-bold mb-3">Welcome to Admin Portal</h1>
      <p class="lead">Manage and oversee the exam practicing platform with ease.</p>
    </div>
    <div></div> <!-- Spacer for bottom alignment -->
  </div>

  <!-- Right Column: Login Form -->
  <div class="adm-login-right d-flex align-items-center justify-content-center">
    <div class="adm-login-form-container p-4 p-md-5">
      <h3 class="mb-2 fw-bold">Login to Account</h3>
      <p class="text-muted mb-4">Please enter your credentials to access the CMS</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Username Field -->
        <div class="form-floating mb-3">
          <input
            type="text"
            class="form-control"
            id="username"
            placeholder="Username"
            formControlName="username"
            [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
          <label for="username">Username</label>
          <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="invalid-feedback">
            Username is required.
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-floating mb-3">
          <input
            [type]="passwordVisible ? 'text' : 'password'"
            class="form-control"
            id="password"
            placeholder="Password"
            formControlName="password"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <label for="password">Password</label>
          <button
            type="button"
            class="btn btn-link adm-password-toggle"
            (click)="togglePasswordVisibility()">
            <mat-icon>{{ passwordVisible ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="invalid-feedback">
            Password is required.
          </div>
        </div>

        <div class="d-flex justify-content-end mb-4">
          <a href="#" class="text-decoration-none">Forgot Password?</a>
        </div>

        <!-- Submit Button -->
        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg" [disabled]="loginForm.invalid">
            Sign In
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
