<div class="ex-page">
  <header class="ex-page-head">
    <p class="ex-breadcrumb">Admin / Exams</p>
    <h1 class="ex-page-title">Exams</h1>
  </header>

  <div class="ex-panels">
    <adm-exam-year-list
      class="ex-panel-list"
      [exams]="exams"
      [selectedExamId]="selectedExamId"
      (create)="openExamModal(null)"
      (select)="selectExam($event)"
    ></adm-exam-year-list>

    <adm-exam-detail
      class="ex-panel-detail"
      [exam]="selectedExam"
      (editExam)="openExamModal(selectedExam)"
      (removeExam)="removeExam()"
      (addSection)="openSectionModal()"
      (editScope)="openScopeModal($event)"
      (removeSection)="removeSection($event)"
      (createMold)="openMoldModal(null)"
      (editMold)="openMoldModal($event)"
      (removeMold)="removeMold($event)"
      (addPage)="addPage($event)"
      (addBlock)="addBlock($event)"
      (removeBlock)="removeBlock($event)"
      (patchBlock)="patchBlock($event)"
    ></adm-exam-detail>
  </div>
</div>

@if (overlay === 'exam') {
  <adm-exam-modal
    [exam]="editingExam"
    (dismiss)="closeOverlay()"
    (save)="saveExam($event)"
  ></adm-exam-modal>
}

@if (overlay === 'section' && selectedExam) {
  <adm-section-modal
    [exam]="selectedExam!"
    (dismiss)="closeOverlay()"
    (save)="addSection($event)"
  ></adm-section-modal>
}

@if (overlay === 'scope' && editingSection) {
  <adm-scope-modal
    [section]="editingSection!"
    [examCode]="selectedExam?.code ?? ''"
    (dismiss)="closeOverlay()"
    (save)="saveScope($event)"
  ></adm-scope-modal>
}

@if (overlay === 'mold' && selectedExam) {
  <adm-mold-modal
    [mold]="editingMold"
    [exam]="selectedExam!"
    (dismiss)="closeOverlay()"
    (save)="saveMold($event)"
  ></adm-mold-modal>
}
