<section class="ex-card">
  <div class="ex-card-head">
    <div class="ex-card-text">
      <h4 class="ex-subject">{{ subjectName }}</h4>
      <p class="ex-card-sub">
        Units in scope · {{ units.length }} selected · {{ questionTotal }} questions available
      </p>
    </div>
    <div class="ex-card-actions">
      <button type="button" class="ex-link" (click)="editScope.emit()">Edit scope</button>
      @if (removable) {
        <button type="button" class="ex-remove" title="Remove section" (click)="remove.emit()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"></path>
          </svg>
        </button>
      }
    </div>
  </div>

  <div class="ex-chips">
    @for (unit of units; track unit.id) {
      <span class="ex-chip">
        {{ unit.title }}<span class="ex-chip-count">{{ unit.questionCount }} q</span>
      </span>
    } @empty {
      <p class="ex-chips-empty">No units picked yet for this subject.</p>
    }
    <button type="button" class="ex-chip-add" (click)="editScope.emit()">+ Add unit</button>
  </div>
</section>
