<adm-modal-shell
  [eyebrow]="eyebrow"
  title="Add subject section"
  [width]="760"
  confirmLabel="Add section"
  (dismiss)="dismiss.emit()"
  (confirm)="confirm()"
>
  <div class="ex-form">
    <div class="ex-grid">
      <div class="sm-field">
        <span class="sm-field-label">Subject</span>
        <div class="ex-chips">
          @for (subject of availableSubjects; track subject.id) {
            <button
              type="button"
              class="ex-chip"
              [class.on]="subject.id === subjectId"
              (click)="pickSubject(subject)"
            >
              {{ subject.name }}
            </button>
          } @empty {
            <p class="ex-note">Every subject already has a section in this exam.</p>
          }
        </div>
      </div>

      <label class="sm-field">
        <span class="sm-field-label">
          Section label <span class="ex-optional">optional</span>
        </span>
        <input
          class="sm-field-control"
          type="text"
          placeholder="e.g. Tư duy Đọc hiểu"
          [(ngModel)]="label"
        />
      </label>
    </div>

    <div class="sm-field">
      <div class="ex-scope-head">
        <span class="sm-field-label">Unit scope</span>
        <span class="sm-field-hint">{{ scopeHint }}</span>
      </div>
      <adm-unit-transfer
        [units]="units"
        [selectedIds]="unitIds"
        [listHeight]="220"
        (selectedIdsChange)="unitIds = $event"
      ></adm-unit-transfer>
    </div>
  </div>
</adm-modal-shell>
