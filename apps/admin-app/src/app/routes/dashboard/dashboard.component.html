<div class="dp-page">
  <header class="dp-head">
    <p class="dp-breadcrumb">Admin / Dashboard</p>
    <h1 class="dp-title">Dashboard</h1>
  </header>

  <div class="dp-kpis">
    @for (kpi of kpis(); track kpi.id) {
      <adm-kpi-card [kpi]="kpi"></adm-kpi-card>
    }
  </div>

  <div class="dp-charts">
    <adm-trend-chart
      title="Revenue"
      [series]="revenue()"
      [range]="revenueRange()"
      color="#1f6e52"
      fill="rgba(31, 110, 82, 0.1)"
      prefix="$"
      caption="Total revenue"
      (rangeChange)="selectRevenueRange($event)"
    ></adm-trend-chart>

    <adm-trend-chart
      title="Test completions"
      [series]="tests()"
      [range]="testsRange()"
      color="#2c5aa8"
      fill="rgba(44, 90, 168, 0.1)"
      caption="Tests completed"
      (rangeChange)="selectTestsRange($event)"
    ></adm-trend-chart>
  </div>

  <div class="dp-exams">
    <adm-exam-chart
      [series]="examSeries()"
      [range]="examsRange()"
      (rangeChange)="selectExamsRange($event)"
      (toggleExam)="toggleExam($event)"
      (showAll)="showAllExams()"
      (resetToTop)="resetExamsToTop()"
    ></adm-exam-chart>
    <button type="button" class="dp-view-all" (click)="openExams()">
      View all exams →
    </button>
  </div>
</div>
