<ng-container *ngIf="authService.isAuthenticated$ | async; else routerOnly">
  <mat-sidenav-container class="adm-shell">
    <mat-sidenav class="adm-sidebar" mode="side" [opened]="true" disableClose>
      <div class="adm-sidebar-brand">
        <span class="adm-sidebar-brand-text">Admin Panel</span>
      </div>

      <nav class="adm-nav-list">
        <a
          *ngFor="let link of navLinks"
          [routerLink]="['/', link.route]"
          routerLinkActive="adm-nav-link--active"
          class="adm-nav-link"
        >
          <mat-icon class="adm-nav-link-icon">{{ link.icon }}</mat-icon>
          <span class="adm-nav-link-label">{{ link.label }}</span>
        </a>
      </nav>

      <div class="adm-sidebar-footer" *ngIf="currentUser as user">
        <div class="adm-user-avatar">{{ userInitials }}</div>
        <span class="adm-user-name">{{ user.username }}</span>
        <button
          mat-icon-button
          class="adm-logout-btn"
          aria-label="Logout"
          (click)="logout()"
        >
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    </mat-sidenav>

    <mat-sidenav-content class="adm-content">
      <header class="adm-topbar">
        <span class="adm-topbar-title">{{ pageTitle }}</span>
        <button mat-icon-button class="adm-topbar-bell" aria-label="Notifications">
          <mat-icon>notifications</mat-icon>
        </button>
      </header>

      <main class="adm-page">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</ng-container>

<ng-template #routerOnly>
  <router-outlet></router-outlet>
</ng-template>
