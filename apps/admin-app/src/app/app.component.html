<div class="adm-admin-layout">
  <!-- Sidebar Navigation -->
  <aside class="adm-sidebar" *ngIf="authService.isAuthenticated$ | async">
    <a class="adm-brand" [routerLink]="['/', ADMIN_APP_ROUTES.DASHBOARD]">
      <span class="adm-brand-mark">E</span>
      <span class="adm-brand-text">
        <span class="adm-brand-name">ExamPrep</span>
        <span class="adm-brand-tag">CMS Admin</span>
      </span>
    </a>

    <nav class="adm-nav-scroll">
      <div class="adm-nav-group" *ngFor="let group of navGroups">
        <div class="adm-nav-group-label">{{ group.label }}</div>
        <ul class="adm-nav-list">
          <li class="adm-nav-item" *ngFor="let item of group.items">
            <a [routerLink]="['/', item.route]" routerLinkActive="active" class="adm-nav-link">
              <svg
                class="adm-nav-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path [attr.d]="item.icon"></path>
              </svg>
              <span class="adm-nav-label">{{ item.label }}</span>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <div class="adm-sidebar-footer">
      <span class="adm-user-avatar">AD</span>
      <span class="adm-user-info">
        <span class="adm-user-name">Admin User</span>
        <span class="adm-user-role">Administrator</span>
      </span>
      <a
        class="adm-logout-btn"
        title="Sign out"
        (click)="authService.logout()"
        [routerLink]="['/', ADMIN_APP_ROUTES.LOGIN]"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 17l5-5-5-5M20 12H9M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5"></path>
        </svg>
      </a>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="adm-main-content">
    <router-outlet></router-outlet>
  </main>
</div>
