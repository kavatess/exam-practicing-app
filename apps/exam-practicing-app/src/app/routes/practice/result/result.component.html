<div class="epa-practice-completion">
    <mat-icon class="epa-completion-icon">emoji_events</mat-icon>
    <h1 class="epa-completion-title">Practice Completed</h1>
    <p class="epa-completion-stats">{{ evalTxt$ | async }}</p>
    <div class="epa-rewards-container">
        <div class="epa-reward-card">
            <div class="epa-reward-card-header gems-header">Gems</div>
            <div class="epa-reward-card-body">
                <img
                    src="https://d35aaqx5ub95lt.cloudfront.net/images/gems/45010d4463a2f474257434a633456e4f.svg"
                    alt="Gems"
                />
                <span>+{{ (rewards$ | async)?.gems }}</span>
            </div>
        </div>
        <div class="epa-reward-card">
            <div class="epa-reward-card-header energies-header">Energies</div>
            <div class="epa-reward-card-body">
                <img
                    src="https://d35aaqx5ub95lt.cloudfront.net/images/hearts/7631e3ee734dd4fe7792626b59457fa4.svg"
                    alt="Energies"
                />
                <span>+{{ (rewards$ | async)?.energies }}</span>
            </div>
        </div>
    </div>
</div>
<div class="epa-practice-footer">
    <div class="epa-completion-footer-btn-group">
        <button mat-fab extended (click)="backToDashboard()">
            <mat-icon>dashboard</mat-icon>
            Back to Dashboard
        </button>
        <button mat-fab extended (click)="reviewPractice()">
            <mat-icon>reviews</mat-icon>
            Review Practice
        </button>
    </div>
</div>
