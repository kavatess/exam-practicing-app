<div class="epa-shop">
    <div class="epa-shop-right-container container-fluid">
        <div class="epa-container">
            <epa-dropdown-item [showCourseSelect]="true"></epa-dropdown-item>
            <epa-quest-list></epa-quest-list>
        </div>
    </div>

    <div class="epa-shop-left-container container-fluid">
        @for (section of shopList$ | async; track section.id) {
            <div class="shop-section">
                <h2 class="section-title">{{ section.title }}</h2>
                <div class="item-list">
                    @for (item of section.items; track item.id) {
                        <div class="item-card">
                            <div class="item-image">
                                <img [src]="item.iconUrl" [alt]="item.title">
                            </div>
                            <div class="item-details">
                                <h3 class="item-title">{{ item.title }}</h3>
                                <p class="item-description">{{ item.description }}</p>
                            </div>
                            <div class="item-action">
                                <button
                                    class="price-button"
                                    [disabled]="purchasing$ | async"
                                    (click)="purchaseItem(item.id)">
                                    @if (purchasing$ | async) {
                                        <div class="spinner-border spinner-border-sm" role="status">
                                            <span class="visually-hidden">Loading...</span>
                                        </div>
                                    } @else {
                                        @if (item.currency?.iconUrl) {
                                            <img [src]="item.currency.iconUrl" class="currency-icon" alt="Currency">
                                        }
                                        <span class="price-text">{{ item.price }}</span>
                                    }
                                </button>
                            </div>
                        </div>
                    }
                </div>
            </div>
        }
    </div>
</div>
