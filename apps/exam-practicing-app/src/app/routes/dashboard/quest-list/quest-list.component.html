<epa-card-list title="Tasks">
    <div class="epa-card-items">
        <ng-container *ngFor="let userQuest of quests$ | async">
            <div class="epa-quest-item">
                <img class="epa-quest-icon" [src]="userQuest.quest?.iconUrl" alt="" />

                <div class="epa-quest-description">
                    <div class="epa-quest-name">{{ userQuest.quest?.name }}</div>

                    <div class="epa-quest-progress">
                        <div class="progress" role="progressbar">
                            <div
                                class="progress-bar bg-success"
                                [style.width.%]="getQuestPercentage(userQuest)"
                            >
                                {{ userQuest.progress }} / {{ userQuest.quest?.totalProgress }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>
    </div>
</epa-card-list>
